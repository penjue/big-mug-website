<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ code }} | Big Mug</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:Arial, Helvetica, sans-serif;
      background:#2d1c13;
      color:white;
      padding:24px;
      text-align:center;
    }

    .box{
      max-width:520px;
      background:#fffaf5;
      color:#1d1713;
      padding:40px 30px;
      border-radius:22px;
      box-shadow:0 20px 60px rgba(0,0,0,.35);
    }

    h1{
      font-size:4rem;
      margin:0;
      color:#c99853;
    }

    h2{
      color:#3b2418;
      margin:10px 0 14px;
    }

    p{
      color:#6d5a50;
    }

    a{
      display:inline-block;
      margin-top:18px;
      background:#c99853;
      color:#1d1713;
      text-decoration:none;
      font-weight:700;
      padding:12px 20px;
      border-radius:999px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>{{ code }}</h1>
    <h2>Big Mug</h2>
    <p>{{ message }}</p>
    <a href="/">Return to Homepage</a>
  </div>
</body>
</html>
