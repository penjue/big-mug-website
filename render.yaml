services:
  - type: web
    name: big-mug
    runtime: python  
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 60 timeline_app:app
    healthCheckPath: /health
    envVars:
      - key: BIG_MUG_SECRET_KEY
        generateValue: true
      - key: BIG_MUG_ADMIN_USER
        value: bigmugadmin
      - key: BIG_MUG_ADMIN_PASSWORD
        sync: false
      - key: BIG_MUG_HTTPS
        value: "1"
      - key: BIG_MUG_TRUST_PROXY
        value: "1"
      - key: BIG_MUG_DB_PATH
        value: /opt/render/project/src/data/big_mug.db
      - key: FLASK_DEBUG
        value: "0"
    disk:
      name: big-mug-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
